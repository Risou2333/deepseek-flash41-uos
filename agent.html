<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>USO · 工程 Agent</title><link rel="stylesheet" href="/static/agent.css"></head>
<body><header><a href="/">← 办公聊天</a><strong>USO <span>工程 Agent</span></strong><span id="connection">检查本地登录…</span></header>
<div id="loginNotice" hidden>请先在<a href="/">聊天页面</a>完成首次配置并登录，然后返回本页。</div>
<main id="agentWorkspace" hidden>
<aside><h1>工程</h1><form id="openForm"><label for="projectPath">本机工程目录</label><input id="projectPath" placeholder="/home/casic/projects/my-app" required><button>打开工程</button></form><p class="hint">目录位于运行 Python 服务的电脑。打开后，任务可按需将工程内容提交至 DeepSeek。</p><label for="projects">最近工程</label><select id="projects"><option value="">选择工程</option></select><h2 id="projectName">尚未打开</h2><button id="refreshTree">刷新索引</button><form id="searchForm"><input id="query" placeholder="搜索代码文字" aria-label="搜索代码文字"><button>搜索</button></form><div id="tree" aria-label="工程文件列表"></div><button id="moreFiles" hidden>加载更多文件</button><p id="treeInfo" class="hint"></p></aside>
<section class="task-column"><div class="section-title"><h1>工程任务</h1><button id="refreshRuns">刷新历史</button></div><label for="runs">任务记录</label><select id="runs"><option value="">新任务</option></select><form id="taskForm"><label for="task">要完成什么？</label><textarea id="task" rows="4" placeholder="例如：查找项目中的一个错误，提出补丁并运行相关测试。" required></textarea><div class="options"><label>思考 <select id="effort"><option value="none">关闭</option><option value="low">轻量</option><option value="high" selected>深入</option><option value="max">最强</option></select></label><label>轮数 <input id="maxSteps" type="number" min="1" max="80" value="24"></label><label>上下文 <select id="contextBudget"><option value="48000">4.8 万字符</option><option value="96000" selected>9.6 万字符</option><option value="192000">19.2 万字符</option></select></label></div><button id="startTask">开始任务</button><button id="stopTask" type="button" disabled>停止</button></form><p id="status" role="status">文件写入前可审阅差异；命令执行前逐条确认。</p><div id="approval" hidden><h2>等待审阅</h2><p id="approvalHint"></p><pre id="approvalContent"></pre><button id="accept">接受并继续</button><button id="reject">拒绝并继续</button></div><pre id="liveProgress" hidden></pre><div id="events" aria-live="polite"></div><details><summary>模型、用量与任务诊断</summary><pre id="usage">尚无调用</pre></details></section>
<section class="inspector"><h1>检查与恢复</h1><details open><summary id="fileTitle">文件预览</summary><pre id="fileContent">点击左侧文件按页查看内容</pre><button id="nextPage" hidden>下一页</button></details><details><summary>项目记忆</summary><p class="hint">记录目标、进度、已知问题；开始新任务时自动加入上下文。</p><textarea id="memory" rows="9" maxlength="12000" aria-label="项目记忆"></textarea><button id="saveMemory">保存记忆</button></details><details><summary>Git 状态与差异</summary><button id="gitStatus">状态</button><button id="gitDiff">查看 diff</button><pre id="gitOutput">尚未查询</pre></details><details open><summary>修改记录</summary><button id="refreshChanges">刷新修改</button><div id="changes"></div></details></section>
</main><script src="/static/agent.js"></script></body></html>
